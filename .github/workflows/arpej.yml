name: arpej
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer seulement une notification de test"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python3 arpej.py ${{ inputs.test && '--test' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
