name: crous
on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: state_crous.json
          key: crous-${{ github.run_id }}
          restore-keys: crous-
      - run: python3 crous.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
